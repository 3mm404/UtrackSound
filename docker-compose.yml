x-app: &app
  image: utrack-demo:local
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env
  volumes:
    - app-storage:/var/www/html/storage/app
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  queue:
    <<: *app
    environment:
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
    stop_grace_period: 100s
    depends_on:
      app:
        condition: service_healthy

  reverb:
    <<: *app
    environment:
      RUN_MIGRATIONS: "false"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  redis-data:
